<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой магазин{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        header {
            background: #1a1a1a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        header h1 {
            font-size: 22px;
            font-weight: 600;
        }
        header nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            transition: color 0.2s;
        }
        header nav a:hover {
            color: white;
        }
        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .flash-messages {
            margin-bottom: 20px;
        }
        .flash-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #c8e6c9;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #333;
        }
        .btn-small {
            padding: 6px 14px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-small:hover {
            background: #333;
        }
        .btn-danger {
            background: #c62828;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>
    <header>
        <h1>Мой магазин</h1>
        <nav>
            <a href="{{ url_for('main') }}">Главная</a>
            <a href="{{ url_for('cart') }}">Корзина</a>
            {% if session.user_id %}
                <a href="{{ url_for('profile') }}">Профиль</a>
                <a href="{{ url_for('logout') }}" onclick="return confirm('Вы действительно хотите выйти из аккаунта?');">Выход</a>
            {% else %}
                <a href="{{ url_for('login') }}">Вход</a>
                <a href="{{ url_for('register') }}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
